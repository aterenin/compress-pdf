# Evaluation corpus sources. Consumed by `cargo evals fetch` / `cargo evals status`.
#
# Each source is cloned shallowly at the pinned commit into evals/corpus/<name>/,
# restricted to `paths` with a sparse checkout. Bump `rev` deliberately; the
# manifest written by `fetch` records what is actually on disk.

[[source]]
name = "py-pdf"
git = "https://github.com/py-pdf/sample-files"
rev = "02b8203bf416db3dbdb03438bc8278dfcb0555f3"
paths = ["."]
license = "CC-BY-SA-4.0"
roles = ["scoring", "soak"]

[[source]]
name = "pdfjs"
git = "https://github.com/mozilla/pdf.js"
rev = "59c19f10ed1f11504d0684b491bbd464d08fad2f"
paths = ["test/pdfs"]
license = "Apache-2.0 for the repository; individual test PDFs carry their own terms"
roles = ["soak"]
# *.link files hold a URL each; `fetch` downloads them into evals/corpus/pdfjs-linked/.
links = true

[[source]]
name = "verapdf"
git = "https://github.com/veraPDF/veraPDF-corpus"
rev = "b6aeac4fbef2ced8aa134df131056b6467676aa9"
paths = ["."]
license = "CC-BY-4.0"
roles = ["soak"]

# Named subsets, as paths relative to evals/corpus/. The evals test harness
# runs `quick` by default (EVALS_SUBSET=<name> selects another; `full` is
# every PDF under evals/corpus/). `scoring` is the hand-picked set compared
# against reference outputs by `cargo evals score`; populated once reference
# outputs exist for the chosen files.
[subsets]
scoring = [
    # py-pdf sample files (all but the password-protected one, which the
    # pipeline refuses by design).
    "py-pdf/001-trivial/minimal-document.pdf",
    "py-pdf/002-trivial-libre-office-writer/002-trivial-libre-office-writer.pdf",
    "py-pdf/003-pdflatex-image/pdflatex-image.pdf",
    "py-pdf/004-pdflatex-4-pages/pdflatex-4-pages.pdf",
    "py-pdf/006-pdflatex-outline/pdflatex-outline.pdf",
    "py-pdf/007-imagemagick-images/imagemagick-ASCII85Decode.pdf",
    "py-pdf/007-imagemagick-images/imagemagick-CCITTFaxDecode.pdf",
    "py-pdf/007-imagemagick-images/imagemagick-images.pdf",
    "py-pdf/007-imagemagick-images/imagemagick-lzw.pdf",
    "py-pdf/008-reportlab-inline-image/inline-image.pdf",
    "py-pdf/009-pdflatex-geotopo/GeoTopo-komprimiert.pdf",
    "py-pdf/009-pdflatex-geotopo/GeoTopo.pdf",
    "py-pdf/010-pdflatex-forms/pdflatex-forms.pdf",
    "py-pdf/011-google-doc-document/google-doc-document.pdf",
    "py-pdf/012-libreoffice-form/libreoffice-form.pdf",
    "py-pdf/013-reportlab-overlay/reportlab-overlay.pdf",
    "py-pdf/014-outlines/mistitled_outlines_example.pdf",
    "py-pdf/015-arabic/habibi-oneline-cmap.pdf",
    "py-pdf/015-arabic/habibi-rotated.pdf",
    "py-pdf/015-arabic/habibi.pdf",
    "py-pdf/016-libre-office-link/libre-office-link.pdf",
    "py-pdf/017-unreadable-meta-data/unreadablemetadata.pdf",
    "py-pdf/018-base64-image/base64image.pdf",
    "py-pdf/019-grayscale-image/grayscale-image.pdf",
    "py-pdf/020-xmp/output_with_metadata_pymupdf.pdf",
    "py-pdf/021-pdfa/crazyones-pdfa.pdf",
    "py-pdf/022-pdfkit/pdfkit.pdf",
    "py-pdf/023-cmyk-image/cmyk-image.pdf",
    "py-pdf/024-annotations/annotated_pdf.pdf",
    "py-pdf/025-attachment/with-attachment.pdf",
    "py-pdf/026-latex-multicolumn/multicolumn.pdf",
    "py-pdf/027-cropped-rotated-scaled/cropped-rotated-scaled.pdf",
    "py-pdf/028-image-references-deduplication/wrong-references.pdf",
    "py-pdf/029-optional-content-groups/ocg_map_test.pdf",
    # Realistic documents from pdf.js: papers with Type 1 and TrueType
    # fonts, a slide deck, scans with JPX and CCITT, a CID-keyed CFF.
    "pdfjs/test/pdfs/tracemonkey.pdf",
    "pdfjs/test/pdfs/TAMReview.pdf",
    "pdfjs-linked/issue1998.pdf",
    "pdfjs-linked/fit11-talk.pdf",
    "pdfjs/test/pdfs/issue19971.pdf",
    "pdfjs/test/pdfs/issue17069.pdf",
    "pdfjs/test/pdfs/issue6286.pdf",
    "pdfjs/test/pdfs/bug1755507.pdf",
