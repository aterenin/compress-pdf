[package]
name = "compress-pdf"
version = "0.1.0"
edition = "2024"
description = "Command-line PDF compressor: image recompression, font subsetting, and structural cleanup with presets"
license = "MIT"

[lib]
name = "compress_pdf"
path = "src/lib.rs"

[[bin]]
name = "compress-pdf"
path = "src/main.rs"

# Corpus evals: a libtest-mimic harness that registers one test per PDF per
# preset (see CLAUDE.md, "Testing").
[[test]]
name = "evals"
harness = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
lopdf = "0.45"
# Independent reader used only by the verify step (shares no code with lopdf).
hayro-syntax = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Image stage codecs.
fast_image_resize = "6"     # downsampling
flate2 = "1.1"              # Flate encode with predictors
mozjpeg = "0.10"            # JPEG encode (C, via bindings)
zune-core = "0.5"           # colorspace and option types shared with zune-jpeg
zune-jpeg = "0.5"           # JPEG decode

fax = "0.3"                 # CCITT G4 encode
jbig2enc-rust = "0.5"       # JBIG2 symbol-mode encode with shared globals
hayro-ccitt = "0.3"         # CCITT input decode (same crate hayro-syntax uses)
hayro-jbig2 = "0.3"         # JBIG2 input decode (same crate hayro-syntax uses)

# Planned, added when the owning piece is implemented (see CLAUDE.md):
# moxcms = "0.9"              # ICC color conversion
# hayro-jpeg2000              # JPX input decode (already built via hayro-syntax)

# Used only by examples/ (the `cargo evals` tool) and tests.
[dev-dependencies]
libtest-mimic = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
ureq = "3.4"
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
